<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="100%" height="100%" style="background:#0b0f19; font-family:'Inter', -apple-system, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4ade80" />
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <rect x="40" y="30" width="1020" height="75" rx="16" fill="#131c2e" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
  <text x="70" y="65" fill="#ffffff" font-size="22" font-weight="900" letter-spacing="-0.5">PayRevive // Architecture &amp; Data Ingestion Pipeline</text>
  <rect x="680" y="47" width="160" height="24" rx="12" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="1"/>
  <text x="760" y="63" fill="#38bdf8" font-size="11" font-weight="800" text-anchor="middle">PS-02 : ZERO-PROMPT AI</text>
  <text x="70" y="88" fill="#94a3b8" font-size="12">How real-world payment data flows from GPay/Paytm/PhonePe to PayRevive AI and recovers in 12ms</text>

  <!-- STEP 1: Customer UPI Payment Attempt -->
  <g transform="translate(60, 140)">
    <rect width="210" height="150" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <rect x="16" y="14" width="70" height="20" rx="6" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="51" y="28" fill="#38bdf8" font-size="10" font-weight="800" text-anchor="middle">STAGE 1</text>
    <text x="16" y="55" fill="#ffffff" font-size="14" font-weight="800">Customer Checkout</text>
    <text x="16" y="75" fill="#94a3b8" font-size="11">• App: GPay / Paytm / PhonePe</text>
    <text x="16" y="93" fill="#94a3b8" font-size="11">• Order: Swiggy ₹499.00</text>
    <text x="16" y="111" fill="#94a3b8" font-size="11">• VPA: user@okhdfcbank</text>
    <text x="16" y="129" fill="#e2e8f0" font-size="11" font-weight="700">Intent: upi://pay</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 270 215 L 325 215" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="298" y="205" fill="#94a3b8" font-size="10" text-anchor="middle">Initiates</text>

  <!-- STEP 2: Primary Gateway Timeout -->
  <g transform="translate(330, 140)">
    <rect width="210" height="150" rx="14" fill="url(#cardGrad)" stroke="#f87171" stroke-width="1.5"/>
    <rect x="16" y="14" width="70" height="20" rx="6" fill="rgba(248, 113, 113, 0.2)"/>
    <text x="51" y="28" fill="#f87171" font-size="10" font-weight="800" text-anchor="middle">DROP DETECTED</text>
    <text x="16" y="55" fill="#f87171" font-size="14" font-weight="800">Primary Bank Drop</text>
    <text x="16" y="75" fill="#94a3b8" font-size="11">• HDFC / Paytm Core Socket</text>
    <text x="16" y="93" fill="#fca5a5" font-size="11" font-weight="700">• Decline Code: U30</text>
    <text x="16" y="111" fill="#fca5a5" font-size="11">• Latency: &gt; 2400ms SLA</text>
    <text x="16" y="129" fill="#94a3b8" font-size="11">• Normally = Involuntary Churn</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 540 215 L 595 215" stroke="#f87171" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)" />
  <text x="568" y="205" fill="#fca5a5" font-size="10" text-anchor="middle">&lt;15ms Webhook</text>

  <!-- STEP 3: Ingestion Gateway -->
  <g transform="translate(600, 140)">
    <rect width="210" height="150" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="16" y="14" width="80" height="20" rx="6" fill="rgba(56, 189, 248, 0.2)"/>
    <text x="56" y="28" fill="#38bdf8" font-size="10" font-weight="800" text-anchor="middle">ZERO-PROMPT</text>
    <text x="16" y="55" fill="#ffffff" font-size="14" font-weight="800">PayRevive Ingestion</text>
    <text x="16" y="75" fill="#94a3b8" font-size="11">• POST /api/webhook/custom</text>
    <text x="16" y="93" fill="#94a3b8" font-size="11">• JSON Payload Ingested</text>
    <text x="16" y="111" fill="#38bdf8" font-size="11" font-weight="700">• 0 Typed Prompts Required</text>
    <text x="16" y="129" fill="#94a3b8" font-size="11">• Ambient Trigger Fired</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <path d="M 810 215 L 865 215" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="838" y="205" fill="#94a3b8" font-size="10" text-anchor="middle">Real-time</text>

  <!-- STEP 4: Ambient Sensor Check -->
  <g transform="translate(870, 140)">
    <rect width="180" height="150" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <rect x="16" y="14" width="90" height="20" rx="6" fill="rgba(74, 222, 128, 0.15)"/>
    <text x="61" y="28" fill="#4ade80" font-size="10" font-weight="800" text-anchor="middle">LIVE SENSORS</text>
    <text x="16" y="55" fill="#ffffff" font-size="13" font-weight="800">Bank Sentinel</text>
    <text x="16" y="75" fill="#94a3b8" font-size="11">• NPCI Ping: 68ms 🟢</text>
    <text x="16" y="93" fill="#f87171" font-size="11">• HDFC Node: 2450ms 🔴</text>
    <text x="16" y="111" fill="#4ade80" font-size="11">• ICICI Rail: 84ms 🟢</text>
    <text x="16" y="129" fill="#38bdf8" font-size="11" font-weight="700">Reroute Target Ready</text>
  </g>

  <!-- Downward Arrow from Sentinel to AI Brain -->
  <path d="M 705 290 L 705 350" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="730" y="325" fill="#38bdf8" font-size="11" font-weight="700">12ms AI Loop</text>

  <!-- MIDDLE BIG BOX: The AI Autonomous Brain Pipeline -->
  <rect x="60" y="360" width="990" height="230" rx="18" fill="#131c2e" stroke="rgba(192, 132, 252, 0.4)" stroke-width="2"/>
  <rect x="80" y="375" width="230" height="24" rx="6" fill="rgba(192, 132, 252, 0.15)"/>
  <text x="195" y="391" fill="#c084fc" font-size="11" font-weight="800" text-anchor="middle">🧠 ZERO-PROMPT RECOVERY ENGINE</text>

  <!-- 3 Inner Engine Cards -->
  <!-- 1. XGBoost & SHAP -->
  <g transform="translate(80, 415)">
    <rect width="290" height="150" rx="12" fill="#0d1525" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="16" y="28" fill="#38bdf8" font-size="13" font-weight="800">1. XGBoost &amp; TreeSHAP</text>
    <text x="16" y="50" fill="#94a3b8" font-size="11">• Classifies Root Cause: TRANSIENT</text>
    <text x="16" y="68" fill="#94a3b8" font-size="11">• P(Recovery) = 83.5%</text>
    <text x="16" y="86" fill="#94a3b8" font-size="11">• SHAP Weights: Socket Timeout (0.89)</text>
    <text x="16" y="104" fill="#94a3b8" font-size="11">• Eliminates Guesswork</text>
    <text x="16" y="126" fill="#4ade80" font-size="11" font-weight="700">✓ Recovery Recommended</text>
  </g>

  <path d="M 370 490 L 410 490" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 2. Multi-Armed Bandit -->
  <g transform="translate(420, 415)">
    <rect width="290" height="150" rx="12" fill="#0d1525" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="16" y="28" fill="#c084fc" font-size="13" font-weight="800">2. Multi-Armed Bandit (MAB)</text>
    <text x="16" y="50" fill="#94a3b8" font-size="11">• Algorithm: Thompson Sampling</text>
    <text x="16" y="68" fill="#94a3b8" font-size="11">• Evaluates: Reroute vs Payday Retry</text>
    <text x="16" y="86" fill="#94a3b8" font-size="11">• Estimated Gateway Cost: ₹0.35</text>
    <text x="16" y="104" fill="#94a3b8" font-size="11">• Expected Value: ₹416.51</text>
    <text x="16" y="126" fill="#c084fc" font-size="11" font-weight="700">✓ Action: INSTANT_REROUTE</text>
  </g>

  <path d="M 710 490 L 750 490" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 3. Compliance Guardrails -->
  <g transform="translate(760, 415)">
    <rect width="270" height="150" rx="12" fill="#0d1525" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="16" y="28" fill="#4ade80" font-size="13" font-weight="800">3. RBI &amp; NPCI Compliance</text>
    <text x="16" y="50" fill="#94a3b8" font-size="11">• Master Direction on Gateways</text>
    <text x="16" y="68" fill="#94a3b8" font-size="11">• Checks 16-Day Limit Rules</text>
    <text x="16" y="86" fill="#94a3b8" font-size="11">• Checks Anti-Fraud Stolen Flag</text>
    <text x="16" y="104" fill="#94a3b8" font-size="11">• Risk Score: 0.04 (Safe)</text>
    <text x="16" y="126" fill="#4ade80" font-size="11" font-weight="700">✓ Approved for Instant Action</text>
  </g>

  <!-- Downward Arrow from Engine to Execution -->
  <path d="M 555 590 L 555 640" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)" />
  <text x="630" y="620" fill="#4ade80" font-size="11" font-weight="700">Autonomous Dispatch</text>

  <!-- BOTTOM ROW: Autonomous Cross-Tool Dispatches -->
  <!-- 1. Secondary Rail Hot Swap -->
  <g transform="translate(60, 650)">
    <rect width="300" height="140" rx="14" fill="url(#cardGrad)" stroke="#4ade80" stroke-width="1.5"/>
    <rect x="16" y="14" width="90" height="20" rx="6" fill="rgba(74, 222, 128, 0.2)"/>
    <text x="61" y="28" fill="#4ade80" font-size="10" font-weight="800" text-anchor="middle">PRIMARY GOAL</text>
    <text x="16" y="55" fill="#4ade80" font-size="14" font-weight="800">ICICI Backup Rail API</text>
    <text x="16" y="75" fill="#94a3b8" font-size="11">• Preemptive Switch in 12ms</text>
    <text x="16" y="93" fill="#ffffff" font-size="11" font-weight="700">• ₹499 Recovered (0ms drop)</text>
    <text x="16" y="113" fill="#4ade80" font-size="11">• Customer Screen: SUCCESS ✓</text>
  </g>

  <!-- 2. WhatsApp Customer Link -->
  <g transform="translate(390, 650)">
    <rect width="320" height="140" rx="14" fill="url(#cardGrad)" stroke="rgba(37, 211, 102, 0.4)" stroke-width="1.5"/>
    <rect x="16" y="14" width="110" height="20" rx="6" fill="rgba(37, 211, 102, 0.15)"/>
    <text x="71" y="28" fill="#25D366" font-size="10" font-weight="800" text-anchor="middle">CROSS-TOOL 1</text>
    <text x="16" y="55" fill="#ffffff" font-size="14" font-weight="800">WhatsApp 1-Click Link</text>
    <text x="16" y="75" fill="#94a3b8" font-size="11">• Dispatched to: +91 98765-XXXXX</text>
    <text x="16" y="93" fill="#94a3b8" font-size="11">• "Hi Rahul, your Swiggy payment timed out"</text>
    <text x="16" y="113" fill="#38bdf8" font-size="11">• payrevive.ai/pay/rec_8942</text>
  </g>

  <!-- 3. Slack & Dashboard Updates -->
  <g transform="translate(740, 650)">
    <rect width="310" height="140" rx="14" fill="url(#cardGrad)" stroke="rgba(224, 30, 90, 0.4)" stroke-width="1.5"/>
    <rect x="16" y="14" width="110" height="20" rx="6" fill="rgba(224, 30, 90, 0.15)"/>
    <text x="71" y="28" fill="#E01E5A" font-size="10" font-weight="800" text-anchor="middle">CROSS-TOOL 2</text>
    <text x="16" y="55" fill="#ffffff" font-size="14" font-weight="800">Merchant Slack Alert</text>
    <text x="16" y="75" fill="#94a3b8" font-size="11">• Channel: #finops-radar-alerts</text>
    <text x="16" y="93" fill="#94a3b8" font-size="11">• "⚡ ₹499 Recovered via ICICI Rail"</text>
    <text x="16" y="113" fill="#e2e8f0" font-size="11" font-weight="700">• Live WebSocket Feed Updated</text>
  </g>

</svg>
